[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async tests are marked explicitly with @pytest.mark.asyncio
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# SQLModel nudges toward session.exec(); session.query() is valid SQLAlchemy
# and is what the routes and pipeline use.
# The message begins with a newline, so (?s) is needed for `.` to span it.
filterwarnings =
    ignore:(?s).*You probably want to use `session.exec\(\)`.*:DeprecationWarning
